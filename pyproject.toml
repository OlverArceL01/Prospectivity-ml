[project]
name = "prospectivity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arcgis>=2.4.3",
    "contextily>=1.7.1",
    "datamodel-code-generator>=0.83.0",
    "fastapi>=0.141.1",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.3",
    "numpy>=2.4.6",
    "open3d>=0.19.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.53.0",
    "xgboost>=3.2.0",
]

[project.scripts]
prospectivity = "prospectivity:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
